name: CMake on a single platform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -A x64

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}}

    - name: Stage
      run: |
        $artifact = "${{github.workspace}}/artifact"
        New-Item -ItemType Directory -Force -Path $artifact | Out-Null
        Copy-Item "${{github.workspace}}/build/${{env.BUILD_TYPE}}/PakUnmountFix.dll", "${{github.workspace}}/mod.ini" `
            -Destination $artifact

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: PakUnmountFix
        path: ${{github.workspace}}/artifact/
        if-no-files-found: error

    - name: Release
      if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{github.token}}
      run: |
        $commitTime = [DateTimeOffset]::FromUnixTimeSeconds([long](git log -1 --format=%ct)).UtcDateTime
        $version = $commitTime.ToString('yyyy.MM.dd.HHmmss') + '-' + (git rev-parse --short=7 HEAD)
        gh release view $version *> $null
        if ($LASTEXITCODE -eq 0) {
          "Release $version already exists"
          exit 0
        }
        $release = "${{github.workspace}}/release"
        New-Item -ItemType Directory -Force -Path "$release/PakUnmountFix" | Out-Null
        Copy-Item "${{github.workspace}}/artifact/*" -Destination "$release/PakUnmountFix"
        Compress-Archive -Path "$release/PakUnmountFix" -DestinationPath PakUnmountFix.zip
        gh release create $version PakUnmountFix.zip `
          --target $env:GITHUB_SHA --title "PakUnmountFix $version" --generate-notes
